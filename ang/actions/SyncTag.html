<div class="crm-accordion-wrapper crm-sqltask-tag st__position-relative collapsed">
  <div class="crm-accordion-header active action-label">
    <label class="input-checkbox">
      <input ng-model="model['enabled']" style="cursor: pointer;" type="checkbox" ng-true-value="'1'" ng-false-value="'0'">
      &nbsp;
      {{ts('Synchronise Tag')}}
      <span ng-if="model['action_title']" class="sql-task-action-title">{{model['action_title']}}</span>
    </label>
    <button class="btn btn-secondary st__m-0" ng-click="removeItemFromArray(index)">
      <i class="crm-i fa-trash header-delete"></i>
      {{ts('Delete')}}
    </button>
  </div>
  <div class="crm-accordion-body" style="display: none;">
    <div class="sql-tasks st__position-relative">
      <div class="sql-task-action-template-wrapper">
        <action-template-select
          model='model'
          action-templates='actionTemplates'
          action-template='actionTemplate'>
        </action-template-select>
        <div class="clear"></div>
        <action-template-form
          model='model'
          action-templates='actionTemplates'
          action-template='actionTemplate'>
        </action-template-form>
      </div>

      <action-additional-info model='model' fieldPrefix="'sync_tag'" index='index'></action-additional-info>

            <text-input
                isrequired="getBooleanFromNumber(model['enabled'])"
                model="model['source_table']"
                sizelength="60"
                fieldlabel="ts('Source Table (entity_id)')"
                fieldid="'tag_source_table' + index"
                inputMaxWidth="'500px'">
            </text-input>

            <check-box
                model="model['use_tags_from_table']"
                fieldlabel="ts('Use tag names from data table? (tag_name)')"
                fieldid="'sync_tags_use_tags_from_table' + index">
            </check-box>

            <ordinary-select2
                ng-if="!getBooleanFromNumber(model['use_tags_from_table'])"
                isrequired="getBooleanFromNumber(model['enabled'])"
                model="model['tag_id']"
                inputMaxWidth="'500px'"
                fieldlabel="ts('Synchronise Tag')"
                fieldid="'tag_tag_id_' + index"
                optionsArray="tagsData"
                isdataloaded="isDataLoaded('tag_tag_id_' + index)">
            </ordinary-select2>

      <ordinary-select2 isrequired="getBooleanFromNumber(model['enabled'])" inputMaxWidth="'240px'"
        model="model['entity_table']" fieldlabel="ts('Choose Entity')"
        fieldid="'tag_entity_table' + index" optionsArray="entityData"
        isdataloaded="isDataLoaded('tag_entity_table' + index)">
      </ordinary-select2>

      <check-box model="model['use_api']" fieldlabel="ts('Use API (slow)')" fieldid="'tag_use_api' + index">
      </check-box>
    </div>
  </div>
</div>
